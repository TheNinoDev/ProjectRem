[package]
name = "projectrem-gui"
edition = "2021"
rust-version = "1.95"
publish = false
build = "build.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
    "wayland",
] }
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "rustls",
    "stream",
] }
rfd = "0.17.2"
dirs = "7.0.0"
# Decoding remote profile pictures (PNG / JPEG / WebP).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
# Temporary development helper: dumps a frame as raw RGBA for visual checks.
screenshot-hook = []